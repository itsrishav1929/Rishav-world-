<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Rishav World</title>

  <style>
    /* Self-contained navbar/footer so this page works even if style.css is missing */
    .nav {
      width: min(1180px, 100%);
      margin: 0 auto;
      min-height: 82px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      border-bottom: 1px solid rgba(255,255,255,.07);
    }

    .nav .logo {
      color: #f4fffd;
      text-decoration: none;
      font-family: Inter, Poppins, system-ui, sans-serif;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1.2px;
      white-space: nowrap;
    }

    .nav .logo span {
      background: linear-gradient(90deg, #4facfe, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav .links {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 28px;
    }

    .nav .links a {
      position: relative;
      color: #aeb8ca;
      text-decoration: none;
      font-family: Inter, Poppins, system-ui, sans-serif;
      font-size: 15px;
      font-weight: 500;
      padding: 30px 0;
      transition: color .25s ease;
    }

    .nav .links a:hover,
    .nav .links a.active {
      color: #f4fffd;
    }

    .nav .links a.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      height: 3px;
      border-radius: 10px;
      background: linear-gradient(90deg, #4facfe, #a855f7);
      box-shadow: 0 0 12px rgba(103,247,223,.25);
    }

    body > footer {
      width: 100%;
      padding: 22px 20px 28px;
      text-align: center;
      color: #71808f;
      font-family: Inter, Poppins, system-ui, sans-serif;
      font-size: 13px;
      border-top: 1px solid rgba(255,255,255,.06);
      background: rgba(3,7,13,.75);
    }

    @media (max-width: 850px) {
      .nav {
        min-height: auto;
        padding: 18px 20px;
        flex-direction: column;
        gap: 14px;
      }

      .nav .links {
        gap: 18px;
        justify-content: center;
      }

      .nav .links a {
        padding: 6px 0 12px;
        font-size: 14px;
      }

      .nav .links a.active::after {
        bottom: 2px;
      }
    }

    @media (max-width: 520px) {
      .nav .logo {
        font-size: 25px;
      }

      .nav .links {
        gap: 12px 16px;
      }

      .nav .links a {
        font-size: 12px;
      }

    :root {
      --bg: #050911;
      --teal: #67f7df;
      --mint: #b8fff2;
      --muted: #6f9f9b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 48%, rgba(52, 231, 207, .10), transparent 25%),
        radial-gradient(circle at 50% 50%, rgba(18, 72, 78, .13), transparent 48%),
        linear-gradient(135deg, #02050b 0%, #071019 52%, #03070d 100%);
      color: #f4fffd;
      overflow-x: hidden;
    }

    /* Cinematic atmosphere */
    .cinematic-projects {
      position: relative;
      min-height: calc(100vh - 135px);
      display: grid;
      place-items: center;
      padding: 80px 20px;
      overflow: hidden;
      isolation: isolate;
    }

    .cinematic-projects::before {
      content: "";
      position: absolute;
      width: 65vw;
      height: 65vw;
      max-width: 850px;
      max-height: 850px;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(
        ellipse,
        rgba(102, 255, 231, .13) 0%,
        rgba(102, 255, 231, .045) 27%,
        transparent 68%
      );
      filter: blur(18px);
      opacity: .55;
      animation: spotlight 5s ease-in-out infinite;
      z-index: -2;
    }

    .cinematic-projects::after {
      content: "";
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(circle at 20% 30%, rgba(85, 255, 229, .05), transparent 15%),
        radial-gradient(circle at 80% 65%, rgba(85, 255, 229, .045), transparent 17%),
        radial-gradient(circle at 45% 85%, rgba(255,255,255,.025), transparent 12%);
      filter: blur(30px);
      animation: fog 16s ease-in-out infinite alternate;
      z-index: -1;
      pointer-events: none;
    }

    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: -1;
    }

    .particles i {
      position: absolute;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: var(--teal);
      opacity: .25;
      animation: float 8s linear infinite;
    }

    .particles i:nth-child(1) { left: 12%; top: 70%; animation-delay: -2s; }
    .particles i:nth-child(2) { left: 25%; top: 20%; animation-delay: -6s; }
    .particles i:nth-child(3) { left: 73%; top: 25%; animation-delay: -4s; }
    .particles i:nth-child(4) { left: 86%; top: 72%; animation-delay: -1s; }
    .particles i:nth-child(5) { left: 58%; top: 12%; animation-delay: -5s; }
    .particles i:nth-child(6) { left: 42%; top: 78%; animation-delay: -3s; }

    .reveal {
      width: min(100%, 1050px);
      text-align: center;
      animation: entrance .95s cubic-bezier(.2,.8,.2,1) both;
    }

    .coming-label {
      margin: 0 0 25px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      animation: flicker 4s infinite;
    }

    .dramatic-line {
      width: min(680px, 80%);
      height: 1px;
      margin: 0 auto 32px;
      background: linear-gradient(90deg, transparent, var(--teal), transparent);
      box-shadow: 0 0 12px rgba(103,247,223,.55);
      transform: scaleX(0);
      animation: lineReveal 1.1s .25s ease-out forwards;
    }

    .dramatic-line.bottom {
      margin: 32px auto 25px;
      animation-delay: 1.7s;
    }

    .not-yet {
      margin: 0 0 14px;
      color: #78a9a5;
      font-size: clamp(20px, 4vw, 35px);
      font-weight: 800;
      letter-spacing: clamp(5px, 1.6vw, 13px);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(103,247,223,.28);
      animation: glitch .15s steps(2) 1.35s, flicker 5s 1.5s infinite;
    }

    .main-message {
      margin: 0;
      color: var(--mint);
      font-family: Inter, Poppins, system-ui, sans-serif;
      font-size: clamp(35px, 7vw, 78px);
      font-weight: 900;
      line-height: .98;
      letter-spacing: clamp(-2px, -.15vw, -1px);
      text-transform: uppercase;
      text-shadow:
        0 0 8px rgba(103,247,223,.55),
        0 0 28px rgba(103,247,223,.24);
    }

    .main-message span {
      display: inline-block;
      opacity: 0;
      transform: translateY(18px);
      animation: letterIn .55s ease forwards;
    }

    .main-message span:nth-child(1) { animation-delay: .9s; }
    .main-message span:nth-child(2) { animation-delay: 1.0s; }
    .main-message span:nth-child(3) { animation-delay: 1.1s; }
    .main-message span:nth-child(4) { animation-delay: 1.2s; }
    .main-message span:nth-child(5) { animation-delay: 1.3s; }
    .main-message span:nth-child(6) { animation-delay: 1.4s; }
    .main-message span:nth-child(7) { animation-delay: 1.5s; }
    .main-message span:nth-child(8) { animation-delay: 1.6s; }

    .message-word {
      display: inline-block;
      white-space: nowrap;
    }

    .pause {
      display: block;
      height: .2em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #86aaa6;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      animation: statusIn .7s 2.15s both;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal);
      box-shadow: 0 0 8px var(--teal), 0 0 18px rgba(103,247,223,.55);
      animation: dotPulse 1.25s ease-in-out infinite;
    }

    @keyframes entrance {
      0% { opacity: 0; transform: scale(.96) translateY(15px); }
      55% { opacity: 1; transform: scale(1.012) translateY(-2px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes spotlight {
      0%,100% { opacity: .42; transform: translate(-50%, -50%) scale(.92); }
      50% { opacity: .72; transform: translate(-50%, -50%) scale(1.08); }
    }

    @keyframes fog {
      from { transform: translate3d(-3%, -1%, 0) scale(1); }
      to { transform: translate3d(4%, 2%, 0) scale(1.08); }
    }

    @keyframes float {
      0% { transform: translateY(30px); opacity: 0; }
      20% { opacity: .3; }
      80% { opacity: .15; }
      100% { transform: translateY(-150px); opacity: 0; }
    }

    @keyframes lineReveal {
      to { transform: scaleX(1); }
    }

    @keyframes letterIn {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes flicker {
      0%, 7%, 9%, 11%, 100% { opacity: 1; }
      8%, 10% { opacity: .35; }
      58% { opacity: .9; }
      59% { opacity: .45; }
      60% { opacity: 1; }
    }

    @keyframes glitch {
      0% { transform: translateX(0); }
      30% { transform: translateX(-3px); }
      60% { transform: translateX(3px); }
      100% { transform: translateX(0); }
    }

    @keyframes statusIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes dotPulse {
      0%,100% { transform: scale(.7); opacity: .55; }
      50% { transform: scale(1.25); opacity: 1; }
    }

    @media (max-width: 700px) {
      .cinematic-projects {
        min-height: calc(100vh - 90px);
        padding: 60px 16px;
      }

      .main-message {
        font-size: clamp(31px, 9vw, 55px);
      }

      .not-yet {
        letter-spacing: 5px;
      }

      .message-word {
        white-space: normal;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition: none !important;
      }

      .main-message span {
        opacity: 1;
        transform: none;
      }

      .dramatic-line {
        transform: scaleX(1);
      }
    }
  </style>
</head>
